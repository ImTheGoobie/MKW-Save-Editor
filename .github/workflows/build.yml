name: Build MKW Save Editor

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and publish
        shell: pwsh
        run: |
          msbuild MKW.WinUI.csproj /restore /t:Publish `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:WindowsAppSDKSelfContained=true `
            /p:WindowsPackageType=None

      - name: Find published EXE
        id: exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Recurse -File -Filter "MKW.WinUI.exe" |
            Where-Object { $_.FullName -match '[\\/]publish[\\/]' } |
            Select-Object -First 1

          if (-not $exe) {
            throw "Could not find published MKW.WinUI.exe"
          }

          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Found: $($exe.FullName)"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: MKW-Save-Editor-win-x64
          path: ${{ steps.exe.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.exe.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
