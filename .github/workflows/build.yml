name: Build portable self-contained Windows app

on:
  push:
    branches: ['**']
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Publish self-contained x64 app
        shell: pwsh
        run: |
          msbuild MKW.WinUI.csproj /restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:WindowsAppSDKSelfContained=true /p:WindowsPackageType=None /p:PublishDir="$($env:GITHUB_WORKSPACE)\publish\" /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'publish/MKW.WinUI.exe')) { throw 'Published executable was not found.' }

      - name: Verify single-file output
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath 'publish' -Recurse -File)
          $files | ForEach-Object { Write-Host $_.FullName }
          if ($files.Count -ne 1 -or $files[0].Name -ne 'MKW.WinUI.exe') {
            throw "Expected only MKW.WinUI.exe in publish output; found $($files.Count) files. Refusing to publish an incomplete release."
          }

      - name: Package single EXE for GitHub Release
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath 'publish/MKW.WinUI.exe' -DestinationPath 'MKW-Save-Editor-win-x64.zip' -Force

      - name: Upload executable as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: MKW-Save-Editor-win-x64
          path: publish/MKW.WinUI.exe
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: MKW-Save-Editor-win-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # This step needs contents: write, granted at the job level below.
    permissions:
      contents: write
